<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./resources/sidm-theme.css">

        <title>Goa Green</title>
    </head>
    <body>
        <div class="app-shell">
            <header class="top-bar">
                <div class="top-bar-left">
                    <span class="top-bar-site-name">Goa Green</span>
                    <span class="top-bar-offline-badge">Offline</span>
                </div>
                <div class="top-bar-right"></div>
            </header>

            <div class="shell-body">
                <div id="map" class="map-area">
                    <div id="popup" class="ol-popup">
                        <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                        <div id="popup-content"></div>
                    </div>
                </div>

                <div class="layers-card" id="layersCard">
                    <div class="layers-card-header" id="layersCardHeader">
                        <span class="layers-card-header-icon">&#9638;</span>
                        <span class="layers-card-title">Layers</span>
                        <span class="layers-card-count" id="layersCardCount"></span>
                        <svg class="layers-card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </div>
                    <div class="layers-card-body">
                        <div class="layers-tabs" id="layersTabs">
                            <button class="layers-tab layers-tab--active" data-tab="layers">Layers</button>
                            <button class="layers-tab" data-tab="base">Base</button>
                        </div>
                        <div class="layers-tab-panel" id="layersCardBody"></div>
                        <div class="layers-tab-panel" id="baseTabPanel" style="display:none">
                            <div class="basemap-options" id="basemapOptions"></div>
                        </div>
                    </div>
                </div>

                <div class="module-dock" id="moduleDock"></div>
            </div>

            <footer class="bottom-bar">
                <div class="bottom-bar-scale" id="bottomBarScale"></div>
                <span class="bottom-bar-coords" id="bottomBarCoords"></span>
                <span class="bottom-bar-attribution" id="bottomBarAttribution"></span>
            </footer>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
<script src="resources/proj4.js"></script>
        <script>proj4.defs('EPSG:32643','+proj=utm +zone=43 +datum=WGS84 +units=m +no_defs');</script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="./resources/olms.js"></script>
        <script src="layers/Buildings_0.js"></script><script src="layers/road_1.js"></script>
        <script src="styles/Buildings_0_style.js"></script><script src="styles/road_1_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script>
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
        <script src="./resources/sidm-shell.js"></script>
    </body>
</html>
